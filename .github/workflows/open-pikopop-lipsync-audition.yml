name: Open PikoPop LipSync Audition

on:
  push:
    branches:
      - open-pikopop-render-worker-20260929
    paths:
      - .render-worker/pikopop.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-pikopop-audition-current
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout render worker
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: open-pikopop-worker/requirements.txt
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r open-pikopop-worker/requirements.txt
      - name: Validate worker
        run: python -m py_compile open-pikopop-worker/render_pikopop.py
      - name: Render true-24fps PikoPop proof
        env:
          PIKOPOP_PUBLIC_OUTPUT: ${{ github.workspace }}/render-output
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python open-pikopop-worker/render_pikopop.py
      - name: Require playable proof
        run: |
          test -s render-output/pikopop-public-audition.mp4
          test -s render-output/pikopop-public-contact-sheet.jpg
          test -s render-output/qa.json
          sha256sum render-output/pikopop-public-audition.mp4
      - name: Upload proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pikopop-public-lipsync-${{ github.sha }}
          path: render-output/**
          retention-days: 3
          if-no-files-found: error

name: ALOS SmolVLM zero-cost proof

on:
  push:
    branches:
      - alos-local-ai-smolvlm-proof-20260909
    paths:
      - ".github/workflows/alos-smolvlm-proof.yml"
      - "alos-proof/smolvlm-proof.sh"
      - "vercel.json"

permissions:
  contents: read
  attestations: read

concurrency:
  group: alos-smolvlm-proof-20260909
  cancel-in-progress: true

jobs:
  real-smolvlm-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Adapt proof for hosted runner filesystem
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("alos-proof/smolvlm-proof.sh")
          source = path.read_text()
          permission_old = 'chmod 0700 "$SB/tmp/home" "$SB/tmp/cache"\nchown 65534:65534 "$SB/tmp/home" "$SB/tmp/cache"'
          permission_new = 'chmod 1777 "$SB/tmp/home" "$SB/tmp/cache"'
          if source.count(permission_old) != 1:
              raise SystemExit("expected hosted-runner permission block not found exactly once")
          source = source.replace(permission_old, permission_new, 1)
          loader_old = r" /^\// { print $1 }"
          loader_new = r" $1 ~ /^\// { print $1 }"
          if source.count(loader_old) != 1:
              raise SystemExit("expected ELF-loader ldd parser block not found exactly once")
          source = source.replace(loader_old, loader_new, 1)
          backend_old = 'find "$CLI_DIR" -maxdepth 1 \\( -type f -o -type l \\) -name '\''*.so*'\'' -print0 |'
          backend_new = 'find "$EXTRACT" \\( -type f -o -type l \\) -name '\''*.so*'\'' -print0 |'
          if source.count(backend_old) != 1:
              raise SystemExit("expected llama backend copy block not found exactly once")
          source = source.replace(backend_old, backend_new, 1)
          executable_old = 'chmod 0555 "$SB/runtime/llama-mtmd-cli"'
          executable_new = 'chmod 0555 "$SB/runtime/llama-mtmd-cli"\nfor libroot in "$SB/lib" "$SB/lib64" "$SB/usr/lib"; do\n  test ! -d "$libroot" || find "$libroot" -xdev -type f -exec chmod 0555 {} +\ndone'
          if source.count(executable_old) != 1:
              raise SystemExit("expected runtime executable permission block not found exactly once")
          source = source.replace(executable_old, executable_new, 1)
          path.write_text(source)
          PY
      - name: Execute governed SmolVLM proof
        shell: bash
        run: bash alos-proof/smolvlm-proof.sh

name: ALOS Windows exact-SHA gate

on:
  push:
    branches:
      - ci/alos-windows-gate-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alos-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-gate:
    name: Windows source gate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify exact clean checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) {
            throw "Expected $env:TARGET_SHA but checked out $actual"
          }
          $dirty = git status --porcelain
          if ($dirty) {
            throw "Checkout is not clean: $dirty"
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          git --version

      - name: Install without lifecycle scripts
        shell: pwsh
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund

      - name: Type-check
        shell: pwsh
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Verify tracked source is unchanged
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            throw "Validation changed tracked source: $dirty"
          }

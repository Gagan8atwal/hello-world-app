<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Lounge ALOS Integration Proof</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:32px;background:#fff;color:#111}
main{max-width:720px;margin:auto}button{font:inherit;padding:12px 18px}#status{font-weight:700}
</style>
</head>
<body>
<main data-alos-project="tvlounge" data-source-repository="Gagan8atwal/hello-world-app">
<h1>TV Lounge — ALOS Agent/Browser Integration</h1>
<button id="verify" type="button">Verify integration</button>
<p id="status" aria-live="polite">READY</p>
<script>
const button=document.getElementById("verify");
const status=document.getElementById("status");
button.addEventListener("click",()=>{status.textContent="VERIFIED:tvlounge";button.dataset.verified="true";});
</script>
</main>
</body>
</html>
